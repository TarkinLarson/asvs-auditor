name: ASVS reference drift

on:
  push:
    paths:
      - 'skills/*/reference/**'
      - 'skills/*/SKILL.md'
      - 'tools/generate-asvs-reference.py'
      - '.github/workflows/asvs-reference-drift.yml'
  # No path filter: this job is a required status check on main, so it must
  # report on every pull request. It is a few seconds and passes trivially when
  # nothing has drifted — a path filter here would leave unrelated PRs with a
  # required check that never runs, and therefore permanently unmergeable.
  pull_request:
  schedule:
    # Weekly, so an upstream ASVS revision to the pinned tag surfaces on its own.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Verify the committed reference matches the pinned ASVS tag
        run: python3 tools/generate-asvs-reference.py --check
