name: ASVS reference drift

on:
  push:
    paths:
      - 'skills/*/reference/**'
      - 'skills/*/SKILL.md'
      - 'tools/generate-asvs-reference.py'
      - '.github/workflows/asvs-reference-drift.yml'
  pull_request:
    paths:
      - 'skills/*/reference/**'
      - 'skills/*/SKILL.md'
      - 'tools/generate-asvs-reference.py'
      - '.github/workflows/asvs-reference-drift.yml'
  schedule:
    # Weekly, so an upstream ASVS revision to the pinned tag surfaces on its own.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Verify the committed reference matches the pinned ASVS tag
        run: python3 tools/generate-asvs-reference.py --check
